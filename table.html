<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Student Details</h2>

<table>
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Department</th>
        <th>Year</th>
    </tr>
    <tr>
        <td>101</td>
        <td>Praveen</td>
        <td>CSE</td>
        <td>3rd</td>
    </tr>
    <tr>
        <td>102</td>
        <td>Anjum</td>
        <td>AIML</td>
        <td>3rd</td>
    </tr>
    <tr>
        <td>103</td>
        <td>Taanya</td>
        <td>Biotech</td>
        <td>3rd</td>
    </tr>
</table>

</body>
</html>
