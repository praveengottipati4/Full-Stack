

<!DOCTYPE html>

<html>

<head>

<title>Datalist Example</title>

</head>

<body>

<form action="" method="get">

<input list="Fruits" name="fruit">

<datalist id="Fruits">

<option value="Apple">

<option value="Grape">

<option value="Jamakay">

<option value="Ice fruit">

<option value="mango">

<option value="Peach">

</datalist>

<input type="submit">

</form>

</body>

</html>
