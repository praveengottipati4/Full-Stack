<!DOCTYPE html>
<html>
<head>
    <title>Interactive Feedback Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .form-container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        input:hover, textarea:hover {
            background-color: #e6f7ff;
            border: 1px solid #0099cc;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background-color: #0099cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #007399;
        }

        .error {
            color: red;
            font-size: 12px;
        }

        .success {
            color: green;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="form-container">
    <h2>Customer Feedback Form</h2>

    <form id="feedbackForm">

        <label>Name:</label>
        <input type="text" id="name" onkeyup="validateName()">
        <div id="nameError" class="error"></div>

        <label>Email:</label>
        <input type="text" id="email" onkeyup="validateEmail()">
        <div id="emailError" class="error"></div>

        <label>Feedback:</label>
        <textarea id="feedback" rows="4" onkeyup="validateFeedback()"></textarea>
        <div id="feedbackError" class="error"></div>

        <button type="button" ondblclick="submitForm()">Submit (Double Click)</button>

        <div id="successMessage" class="success"></div>

    </form>
</div>

<script>

    // Reusable validation function
    function isEmpty(value) {
        return value.trim() === "";
    }

    function validateName() {
        let name = document.getElementById("name").value;
        let error = document.getElementById("nameError");

        if (isEmpty(name)) {
            error.innerHTML = "Name cannot be empty";
            return false;
        } else {
            error.innerHTML = "";
            return true;
        }
    }

    function validateEmail() {
        let email = document.getElementById("email").value;
        let error = document.getElementById("emailError");
        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if (!email.match(emailPattern)) {
            error.innerHTML = "Enter valid email address";
            return false;
        } else {
            error.innerHTML = "";
            return true;
        }
    }

    function validateFeedback() {
        let feedback = document.getElementById("feedback").value;
        let error = document.getElementById("feedbackError");

        if (isEmpty(feedback)) {
            error.innerHTML = "Feedback cannot be empty";
            return false;
        } else {
            error.innerHTML = "";
            return true;
        }
    }

    function submitForm() {

        let isNameValid = validateName();
        let isEmailValid = validateEmail();
        let isFeedbackValid = validateFeedback();

        if (isNameValid && isEmailValid && isFeedbackValid) {
            document.getElementById("successMessage").innerHTML =
                "✅ Thank you! Your feedback has been submitted successfully.";
        } else {
            document.getElementById("successMessage").innerHTML = "";
            alert("Please fix the errors before submitting.");
        }
    }

</script>

</body>
</html>
